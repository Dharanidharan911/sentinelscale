global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sentinelscale-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'demo-api:8000'
          - 'traffic-intelligence:8001'
          - 'demand-intelligence:8002'
          - 'platform:8003'
        labels:
          environment: 'development'
          cluster: 'sentinelscale-local'
