global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # Authoritative metrics scrape job for workload and platform services
  - job_name: 'sentinelscale-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'demo-api:8000'
          - 'platform:8003'
        labels:
          environment: 'production'
          cluster: 'sentinelscale-cluster'
