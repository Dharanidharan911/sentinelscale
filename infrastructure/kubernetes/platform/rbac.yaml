apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelscale-platform
  namespace: sentinelscale
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: core-platform
    app.kubernetes.io/part-of: sentinelscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelscale-platform-reader
  namespace: sentinelscale
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: core-platform
    app.kubernetes.io/part-of: sentinelscale
rules:
  # Read-only access to Deployment specs (desired replicas, matchLabels selector)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

  # Read-only access to actual running Pods matching the workload selector
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelscale-platform-reader-binding
  namespace: sentinelscale
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: core-platform
    app.kubernetes.io/part-of: sentinelscale
subjects:
  - kind: ServiceAccount
    name: sentinelscale-platform
    namespace: sentinelscale
roleRef:
  kind: Role
  name: sentinelscale-platform-reader
  apiGroup: rbac.authorization.k8s.io

