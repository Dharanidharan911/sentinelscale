apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: sentinelscale
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/component: decision-engine
    app.kubernetes.io/part-of: sentinelscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
        app.kubernetes.io/component: decision-engine
        app.kubernetes.io/part-of: sentinelscale
    spec:
      serviceAccountName: sentinelscale-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: platform
          image: sentinelscale/platform:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PORT
              value: "8003"
            - name: TRAFFIC_INTELLIGENCE_URL
              value: "http://traffic-intelligence.sentinelscale.svc.cluster.local:8001"
            - name: DEMAND_INTELLIGENCE_URL
              value: "http://demand-intelligence.sentinelscale.svc.cluster.local:8002"
            - name: PROMETHEUS_URL
              value: "http://prometheus.sentinelscale.svc.cluster.local:9090"
            - name: TELEMETRY_PROVIDER
              value: "hybrid"
            - name: SENTINEL_DRY_RUN
              value: "true"
            - name: SENTINEL_SHADOW_MODE
              value: "true"
            - name: SENTINEL_AUTONOMOUS_ACTIONS_ENABLED
              value: "false"
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.sentinelscale.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "sentinelscale-platform"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: data-volume
          emptyDir: {}
