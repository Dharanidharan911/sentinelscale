apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand-intelligence
  namespace: sentinelscale
  labels:
    app.kubernetes.io/name: demand-intelligence
    app.kubernetes.io/component: intelligence
    app.kubernetes.io/part-of: sentinelscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demand-intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demand-intelligence
        app.kubernetes.io/component: intelligence
        app.kubernetes.io/part-of: sentinelscale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: demand-intelligence
          image: sentinelscale/demand-intelligence:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PORT
              value: "8002"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
