services:
  demo-api:
    build:
      context: ./demo-api
      dockerfile: Dockerfile
    container_name: sentinelscale-demo-api
    restart: unless-stopped
    ports:
      - "${DEMO_API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  traffic-intelligence:
    build:
      context: ./services/traffic-intelligence
      dockerfile: Dockerfile
    container_name: sentinelscale-traffic-intelligence
    restart: unless-stopped
    ports:
      - "${TRAFFIC_INTELLIGENCE_PORT:-8001}:8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  demand-intelligence:
    build:
      context: ./services/demand-intelligence
      dockerfile: Dockerfile
    container_name: sentinelscale-demand-intelligence
    restart: unless-stopped
    ports:
      - "${DEMAND_INTELLIGENCE_PORT:-8002}:8002"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8002
      - PROMETHEUS_URL=${DEMAND_PROMETHEUS_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  platform:
    build:
      context: ./services/platform
      dockerfile: Dockerfile
    container_name: sentinelscale-platform
    restart: unless-stopped
    ports:
      - "${PLATFORM_PORT:-8003}:8003"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8003
      - TRAFFIC_INTELLIGENCE_URL=http://traffic-intelligence:8001
      - DEMAND_INTELLIGENCE_URL=http://demand-intelligence:8002
      - PROMETHEUS_URL=http://prometheus:9090
      - SENTINEL_DRY_RUN=${SENTINEL_DRY_RUN:-true}
      - SENTINEL_SHADOW_MODE=${SENTINEL_SHADOW_MODE:-true}
      - SENTINEL_AUTONOMOUS_ACTIONS_ENABLED=${SENTINEL_AUTONOMOUS_ACTIONS_ENABLED:-false}
      - OBSERVATION_SCHEDULER_ENABLED=${OBSERVATION_SCHEDULER_ENABLED:-true}
      - OBSERVATION_INTERVAL_SECONDS=${OBSERVATION_INTERVAL_SECONDS:-5.0}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sentinelscale-platform}
    depends_on:
      traffic-intelligence:
        condition: service_healthy
      demand-intelligence:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./experiments/results:/app/experiments/results:ro
    networks:
      - sentinelscale-net

  control-center:
    build:
      context: ./services/control-center
      dockerfile: Dockerfile
    container_name: sentinelscale-control-center
    restart: unless-stopped
    ports:
      - "${CONTROL_CENTER_PORT:-8080}:8080"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PLATFORM_URL=http://platform:8003
      - GRAFANA_URL=http://localhost:3000
      - TEMPO_URL=http://localhost:3200
      - LOKI_URL=http://localhost:3100
      - PROMETHEUS_URL=http://localhost:9090
      - PORT=8080
    depends_on:
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: sentinelscale-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: sentinelscale-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    volumes:
      - ./telemetry/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./telemetry/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: sentinelscale-otel-collector
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  tempo:
    image: grafana/tempo:2.4.1
    container_name: sentinelscale-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./telemetry/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  loki:
    image: grafana/loki:2.9.8
    container_name: sentinelscale-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./telemetry/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/var/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentinelscale-net

  k6:
    image: grafana/k6:0.50.0
    container_name: sentinelscale-k6
    profiles:
      - load-test
      - tools
    volumes:
      - ./load-tests/k6:/scripts:ro
    environment:
      - TARGET_URL=${TARGET_URL:-http://demo-api:8000}
      - PROFILE=${PROFILE:-baseline}
      - VU_SCALE=${VU_SCALE:-1.0}
      - DURATION_SCALE=${DURATION_SCALE:-1.0}
    command: run /scripts/workload.js
    networks:
      - sentinelscale-net

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  tempo-data:
    driver: local
  loki-data:
    driver: local

networks:
  sentinelscale-net:
    driver: bridge
