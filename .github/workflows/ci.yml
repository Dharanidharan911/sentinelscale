name: SentinelScale CI

on:
  push:
    branches: [ main, 'member*/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-contracts-and-test:
    name: Lint, Validate Schemas & Run Isolated Pytest Suites
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pydantic pydantic-settings jsonschema flake8

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,build,dist
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,build,dist

      - name: Run All Service Test Suites (Isolated Subprocesses)
        run: |
          python run_tests.py
